<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 320" width="100%" height="100%">
  <defs>
    <filter id="charShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#041E42" flood-opacity="0.2"/>
    </filter>
  </defs>
  <!-- Shadow on floor -->
  <ellipse cx="120" cy="305" rx="55" ry="12" fill="#041E42" opacity="0.18"/>
  <g filter="url(#charShadow)">
    <!-- Legs & Boots -->
    <rect x="92" y="220" width="20" height="60" rx="6" fill="#041E42"/>
    <rect x="128" y="220" width="20" height="60" rx="6" fill="#041E42"/>
    <!-- Boots with Yellow Trim -->
    <path d="M88,270 L114,270 L116,298 L80,298 Q80,285 88,270 Z" fill="#0071CE"/>
    <rect x="84" y="292" width="32" height="6" rx="2" fill="#FFC220"/>
    <path d="M126,270 L152,270 L160,298 L124,298 Q124,285 126,270 Z" fill="#0071CE"/>
    <rect x="124" y="292" width="36" height="6" rx="2" fill="#FFC220"/>

    <!-- Torso / Explorer Jacket (Walmart Blue + Yellow Accent) -->
    <rect x="80" y="145" width="80" height="85" rx="16" fill="#0071CE"/>
    <!-- Collar & Yellow Tie/Scarf -->
    <polygon points="120,145 105,170 135,170" fill="#FFFFFF"/>
    <polygon points="120,165 112,205 120,215 128,205" fill="#FFC220"/>
    <!-- Belt -->
    <rect x="78" y="208" width="84" height="14" rx="4" fill="#041E42"/>
    <rect x="110" y="205" width="20" height="20" rx="4" fill="#FFC220"/>
    <rect x="114" y="209" width="12" height="12" rx="2" fill="#041E42"/>

    <!-- Arms -->
    <!-- Left Arm holding Compass -->
    <path d="M82,150 L52,195 L65,205 L92,165 Z" fill="#0071CE"/>
    <circle cx="50" cy="205" r="14" fill="#FFE082"/>
    <!-- Compass Widget in hand -->
    <circle cx="44" cy="216" r="15" fill="#FFC220" stroke="#041E42" stroke-width="2"/>
    <circle cx="44" cy="216" r="11" fill="#FFFFFF"/>
    <polygon points="44,208 47,216 44,224 41,216" fill="#0071CE"/>

    <!-- Right Arm Waving / Thumbs Up -->
    <path d="M158,150 L188,140 L196,155 L164,170 Z" fill="#0071CE"/>
    <circle cx="196" cy="142" r="13" fill="#FFE082"/>
    <path d="M196,134 Q204,130 200,122 Q192,125 190,135 Z" fill="#FFE082"/>

    <!-- Head & Neck -->
    <rect x="110" y="130" width="20" height="18" fill="#FFE082"/>
    <circle cx="120" cy="98" r="38" fill="#FFE082"/>
    <!-- Hair -->
    <path d="M84,92 Q120,60 156,92 Q158,70 120,62 Q82,70 84,92 Z" fill="#5D4037"/>

    <!-- Eyes (Big, Friendly, Anime/Cartoon style) -->
    <ellipse cx="106" cy="96" rx="6" ry="8" fill="#041E42"/>
    <circle cx="108" cy="93" r="2.5" fill="#FFFFFF"/>
    <ellipse cx="134" cy="96" rx="6" ry="8" fill="#041E42"/>
    <circle cx="136" cy="93" r="2.5" fill="#FFFFFF"/>
    <!-- Cheeks (Blushing) -->
    <circle cx="97" cy="104" r="5" fill="#FF8A80" opacity="0.6"/>
    <circle cx="143" cy="104" r="5" fill="#FF8A80" opacity="0.6"/>
    <!-- Cheerful Smile -->
    <path d="M112,108 Q120,120 128,108" fill="none" stroke="#041E42" stroke-width="3" stroke-linecap="round"/>

    <!-- Explorer Hat (Blue + Golden Band + Badge) -->
    <ellipse cx="120" cy="68" rx="52" ry="12" fill="#041E42"/>
    <path d="M85,66 Q120,30 155,66 Z" fill="#0071CE"/>
    <rect x="85" y="62" width="70" height="9" fill="#FFC220"/>
    <polygon points="120,44 125,52 133,52 127,57 129,65 120,60 111,65 113,57 107,52 115,52" fill="#FFC220"/>
  </g>
</svg>