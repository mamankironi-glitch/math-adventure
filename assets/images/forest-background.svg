<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="forestSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="50%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
    <linearGradient id="treeGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#064E3B"/>
    </linearGradient>
  </defs>
  <!-- Forest Sky Background -->
  <rect width="1200" height="700" fill="url(#forestSky)"/>
  <!-- Light Rays filtering down -->
  <polygon points="200,0 350,0 600,700 350,700" fill="#FFFFFF" opacity="0.08"/>
  <polygon points="500,0 700,0 950,700 650,700" fill="#FFC220" opacity="0.08"/>
  <polygon points="850,0 950,0 1200,700 1000,700" fill="#FFFFFF" opacity="0.07"/>
  <!-- Distant Dense Forest Canopy -->
  <circle cx="200" cy="380" r="140" fill="#047857" opacity="0.7"/>
  <circle cx="450" cy="350" r="170" fill="#065F46" opacity="0.75"/>
  <circle cx="750" cy="360" r="160" fill="#047857" opacity="0.7"/>
  <circle cx="1050" cy="370" r="180" fill="#065F46" opacity="0.8"/>
  <!-- Great Ancient Trees Trunks -->
  <rect x="80" y="280" width="70" height="420" fill="#451A03"/>
  <rect x="350" y="240" width="90" height="460" fill="#3B1703"/>
  <rect x="820" y="260" width="80" height="440" fill="#451A03"/>
  <rect x="1060" y="200" width="100" height="500" fill="#3B1703"/>
  <!-- Tree Tops / Foliage -->
  <ellipse cx="115" cy="250" rx="140" ry="90" fill="url(#treeGrad)"/>
  <ellipse cx="395" cy="200" rx="180" ry="110" fill="url(#treeGrad)"/>
  <ellipse cx="860" cy="220" rx="160" ry="100" fill="url(#treeGrad)"/>
  <ellipse cx="1110" cy="180" rx="190" ry="120" fill="url(#treeGrad)"/>
  <!-- Forest Ground Floor -->
  <path d="M-50,600 Q300,560 650,610 T1250,590 L1250,700 L-50,700 Z" fill="#022C22"/>
  <!-- Magical Glowing Mushrooms and Crystals -->
  <g transform="translate(180, 600)">
    <path d="M10,40 Q25,10 40,40 Z" fill="#F43F5E"/>
    <circle cx="20" cy="25" r="3" fill="#FFFFFF"/>
    <circle cx="30" cy="28" r="2.5" fill="#FFFFFF"/>
    <rect x="22" y="38" width="6" height="15" fill="#FEF08A"/>
    <ellipse cx="25" cy="28" rx="28" ry="18" fill="#F43F5E" opacity="0.15"/>
  </g>
  <g transform="translate(720, 620)">
    <polygon points="20,35 30,10 40,35" fill="#38BDF8"/>
    <polygon points="12,38 20,20 28,38" fill="#FFC220"/>
    <ellipse cx="25" cy="25" rx="30" ry="20" fill="#38BDF8" opacity="0.2"/>
  </g>
</svg>