<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="100%" height="100%">
  <defs>
    <linearGradient id="valSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#BAE6FD"/>
      <stop offset="60%" stop-color="#E0F2FE"/>
      <stop offset="100%" stop-color="#FEF08A"/>
    </linearGradient>
    <linearGradient id="hillBack" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="hillFront" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>
  <!-- Sky -->
  <rect width="1200" height="700" fill="url(#valSky)"/>
  <!-- Bright Sun -->
  <circle cx="950" cy="150" r="60" fill="#FFC220" opacity="0.9"/>
  <circle cx="950" cy="150" r="85" fill="#FFC220" opacity="0.25"/>
  <!-- Distant Mountains -->
  <polygon points="150,420 320,240 500,420" fill="#93C5FD" opacity="0.6"/>
  <polygon points="280,280 320,240 360,280" fill="#FFFFFF" opacity="0.9"/>
  <polygon points="380,450 560,210 740,450" fill="#60A5FA" opacity="0.5"/>
  <polygon points="520,260 560,210 600,260" fill="#FFFFFF" opacity="0.9"/>
  <!-- Rolling Hills Far -->
  <path d="M-50,480 Q250,320 600,440 T1250,410 L1250,700 L-50,700 Z" fill="url(#hillBack)" opacity="0.85"/>
  <!-- Windmill on distant hill -->
  <g transform="translate(300, 310)">
    <polygon points="30,80 37,20 53,20 60,80" fill="#041E42"/>
    <circle cx="45" cy="20" r="5" fill="#FFC220"/>
    <line x1="45" y1="20" x2="15" y2="5" stroke="#0071CE" stroke-width="4"/>
    <line x1="45" y1="20" x2="75" y2="35" stroke="#0071CE" stroke-width="4"/>
    <line x1="45" y1="20" x2="30" y2="50" stroke="#0071CE" stroke-width="4"/>
    <line x1="45" y1="20" x2="60" y2="-10" stroke="#0071CE" stroke-width="4"/>
  </g>
  <!-- Rolling Hills Near -->
  <path d="M-50,540 Q350,460 750,550 T1250,510 L1250,700 L-50,700 Z" fill="url(#hillFront)"/>
  <!-- Wooden Fence Foreground -->
  <g stroke="#78350F" stroke-width="4">
    <line x1="50" y1="620" x2="50" y2="670"/>
    <line x1="120" y1="620" x2="120" y2="675"/>
    <line x1="190" y1="620" x2="190" y2="680"/>
    <line x1="30" y1="635" x2="210" y2="640"/>
    <line x1="30" y1="655" x2="210" y2="660"/>
  </g>
  <!-- Flowers -->
  <circle cx="160" cy="590" r="6" fill="#FFC220"/>
  <circle cx="240" cy="620" r="5" fill="#FFFFFF"/>
  <circle cx="850" cy="610" r="7" fill="#FFC220"/>
  <circle cx="920" cy="630" r="6" fill="#FFFFFF"/>
  <circle cx="1020" cy="600" r="6" fill="#0071CE"/>
</svg>