<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0080EA" />
      <stop offset="100%" stop-color="#0058A8" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066" />
      <stop offset="100%" stop-color="#FFB300" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#041E42" flood-opacity="0.3"/>
    </filter>
  </defs>
  <!-- Background Badge / Shield -->
  <g filter="url(#glow)">
    <rect x="15" y="10" width="95" height="95" rx="24" fill="url(#blueGrad)" stroke="#FFC220" stroke-width="4"/>
    <!-- Compass & Math Symbol in Badge -->
    <circle cx="62" cy="57" r="32" fill="#FFFFFF" opacity="0.15"/>
    <circle cx="62" cy="57" r="24" fill="none" stroke="#FFC220" stroke-width="2.5" stroke-dasharray="4,3"/>
    <!-- Fraction 1/2 stylized -->
    <text x="62" y="48" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">1</text>
    <line x1="48" y1="56" x2="76" y2="56" stroke="#FFC220" stroke-width="3" stroke-linecap="round"/>
    <text x="62" y="74" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="20" fill="#FFFFFF" text-anchor="middle">2</text>
    <!-- Compass Pointer Star -->
    <polygon points="62,18 66,28 76,32 66,36 62,46 58,36 48,32 58,28" fill="#FFC220"/>
  </g>
  <!-- Main Title Text -->
  <g>
    <!-- "MATH" -->
    <text x="125" y="55" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="44" fill="#0071CE" letter-spacing="1">MATH</text>
    <text x="245" y="55" font-family="'Segoe UI', Arial, sans-serif" font-weight="900" font-size="44" fill="#FFC220" letter-spacing="1">ADVENTURE</text>
    <!-- Subtitle Banner -->
    <rect x="125" y="68" width="250" height="26" rx="13" fill="#041E42"/>
    <text x="250" y="85" font-family="'Segoe UI', Arial, sans-serif" font-weight="700" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">PETUALANGAN DI DUNIA NUMERIA</text>
  </g>
</svg>